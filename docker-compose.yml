# ==============================================================================
# Docker Compose Setup for PaperMind (Development Environment)
# Follows .agents/skills/docker-patterns/SKILL.md best practices:
# - Target: dev stage (Hot-reloading enabled via bind mounts)
# - Service discovery & dependency order via service_healthy condition
# - Custom bridge network isolation (rag-network)
# - Variable interpolation from root .env file
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: papermind_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:z
    env_file:
      - ./backend/.env
    restart: unless-stopped
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: papermind_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
